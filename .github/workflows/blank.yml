name: Political Sentiment Analysis

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Analysis Tools
        run: |
          pip install pandas matplotlib

      - name: Execute Sentiment Script
        run: python sentiment_analysis_report.py

      - name: Save Results to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add results/
          git commit -m "Update sentiment graph with latest platform data" || exit 0
          git push
